version: 2

# Propostas semanais de atualização, uma por dependência, como pull request:
# o CI/CD roda os testes em cada uma antes de qualquer merge.
updates:
  # Actions do .github/workflows: troca o SHA fixado e a versão no comentário.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Commits no padrão do projeto: "ci(deps): ...".
    commit-message:
      prefix: ci
      include: scope

  # requirements.txt (servidor) e requirements-dev.txt (testes e lint).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Commits no padrão do projeto: "chore(deps): ...".
    commit-message:
      prefix: chore
      include: scope
