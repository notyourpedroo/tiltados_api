name: CI/CD

# Pull requests: só verifica (testes).
# Push na main (ou disparo manual): verifica, empacota e publica no servidor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; a seguinte espera a anterior terminar.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# As actions ficam fixadas pelo SHA do commit, não pela tag: uma tag pode ser
# reapontada para outro código, o SHA não. A versão vai no comentário, e o
# Dependabot (.github/dependabot.yml) propõe a troca de SHA e comentário juntos.
jobs:
  build:
    name: Testar e empacotar
    runs-on: ubuntu-24.04
    # Instalar as dependências e rodar lint e testes leva cerca de 1 minuto;
    # 10 dá folga para um runner lento e derruba um teste travado antes das 6h
    # do limite padrão.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Mesma versão do Python do servidor.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Os testes também validam os CSVs de files/: um resultado quebrado
      # para aqui, antes de chegar ao servidor.
      - name: Testes
        run: pytest

      - name: Empacotar
        if: github.event_name != 'pull_request'
        run: tar --exclude=__pycache__ -czf release.tgz main.py scripts files requirements.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Publicar no servidor
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Sem "url": o endereço do servidor fica só nos Secrets, fora do código e dos logs.
    environment: production
    # A conferência das rotas desiste em cerca de 5 minutos e meio quando a API não sobe
    # (30 tentativas de até 11s na primeira rota que falha); somada a um
    # requirements.txt novo para instalar e ao rollback, fica bem abaixo de 15.
    # Não apertar: cortar o job no meio da publicação pode deixar o servidor
    # sem o rollback do publicar.sh.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar e publicar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          NAME="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          TARBALL="/tmp/tiltados-api-$NAME.tgz"
          scp -q release.tgz "deploy@$DEPLOY_HOST:$TARBALL"
          ssh "deploy@$DEPLOY_HOST" "bash -s -- '$TARBALL' '$NAME'" < deploy/publicar.sh
